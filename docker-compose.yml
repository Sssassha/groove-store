version: '3'

services:
  web:
    build: .
    container_name: django_groove
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"

  caddy:
    image: caddy:latest
    container_name: caddy_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - static_volume:/app/static
    depends_on:
      - web

volumes:
  static_volume:
